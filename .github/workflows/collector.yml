name: Morning Traffic & Weather Collector (Phase 4)

on:
  schedule:
    # 08:00 AM - 10:00 AM IST (Monday to Friday)
    # IST is UTC+5:30. In UTC, 08:00-10:00 IST is 02:30-04:30 UTC.
    # Cron triggers every 15 minutes during this window on weekdays (Mon-Fri)
    - cron: '30,45 2 * * 1-5'
    - cron: '0,15,30,45 3 * * 1-5'
    - cron: '0,15,30 4 * * 1-5'
  workflow_dispatch:  # Allows manual triggering for testing

permissions:
  contents: write

jobs:
  collect-telemetry:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Live Poll
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
        run: |
          python src/live_collector.py --once

      - name: Commit Updated Telemetry Log
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/live/traffic_weather_live.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(telemetry): record morning corridor poll [skip ci]" && git push)
